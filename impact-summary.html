<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="application-version" content="1.1.0">
<meta name="theme-color" content="#000000">
<title>W.A.T.A. Live Impact Statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--ink:#112f3b;--muted:#5d7480;--line:rgba(17,47,59,.16);--cyan:#19b9e8;--teal:#18a98d;--gold:#f2ad28;--blue:#2553a6;--font:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--ink);font-family:var(--font)}
  button{font:inherit}
  .stats-shell{width:100%;max-width:1380px;margin:0 auto;padding:8px}
  .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
  .stat-card{--accent:var(--cyan);position:relative;display:flex;min-width:0;min-height:294px;overflow:hidden;flex-direction:column;padding:25px 24px 20px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(290px 180px at 92% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 65%),#fff;box-shadow:0 15px 42px rgba(5,29,39,.13),inset 0 1px rgba(255,255,255,.9)}
  .stat-card::before{content:"";position:absolute;top:0;left:24px;right:24px;height:4px;border-radius:0 0 5px 5px;background:var(--accent)}
  .filters-card{--accent:var(--cyan)}.people-card{--accent:var(--teal)}.countries-card{--accent:var(--gold)}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-name{margin:0;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
  .live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(24,169,141,.1)}
  .value{margin:21px 0 5px;font-size:clamp(52px,6vw,82px);font-weight:700;line-height:.86;letter-spacing:-.065em;font-variant-numeric:tabular-nums}
  .value-label{min-height:24px;margin:0;color:var(--blue);font-size:17px;font-weight:700;line-height:1.25}
  .value-note{min-height:38px;margin:7px 0 17px;color:var(--muted);font-size:11px;line-height:1.45}
  .segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:auto;padding:4px;border:1px solid var(--line);border-radius:13px;background:#eef5f7}
  .countries-card .segments{grid-template-columns:repeat(4,minmax(0,1fr))}
  .segment{min-width:0;min-height:42px;padding:7px 5px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
  .segment:hover,.segment:focus-visible{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--ink);outline:none}
  .segment[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 68%,var(--line));background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(17,47,59,.09)}
  .bar-status{display:flex;align-items:center;justify-content:flex-end;gap:7px;width:max-content;min-height:28px;margin:8px 8px 0 auto;padding:6px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(6,21,30,.88);color:#dce8ec;font-size:10px}
  .bar-status .live-dot{width:6px;height:6px}.bar-status.error{color:#ffb9b6}.bar-status button{padding:0;border:0;background:transparent;color:#5dd7f5;font-size:10px;font-weight:700;cursor:pointer}
  .bar-status button:hover,.bar-status button:focus-visible{text-decoration:underline;outline:none}
  @media (max-width:900px){.stats-grid{grid-template-columns:1fr}.stat-card{min-height:272px}.value{font-size:68px}}
  @media (max-width:430px){.stats-shell{padding:6px}.stats-grid{gap:12px}.stat-card{min-height:266px;padding:23px 17px 17px;border-radius:18px}.stat-card::before{left:18px;right:18px}.segment{font-size:9px;padding-inline:3px}.value{font-size:62px}.value-label{font-size:16px}.bar-status{justify-content:center;margin-right:auto;text-align:center}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="stats-shell" aria-label="Live W.A.T.A. impact statistics">
  <div class="stats-grid">
    <section class="stat-card filters-card" aria-labelledby="filtersTitle">
      <div class="card-head"><h2 class="card-name" id="filtersTitle">Filters</h2><span class="live"><span class="live-dot" aria-hidden="true"></span>Live</span></div>
      <div class="value" id="filterValue" aria-live="polite">—</div>
      <p class="value-label" id="filterLabel">Total filters</p>
      <p class="value-note" id="filterNote">Connecting to current impact data…</p>
      <div class="segments impact-segments" aria-label="Choose filter total">
        <button class="segment" type="button" data-impact="inventory" aria-pressed="true">Total</button>
        <button class="segment" type="button" data-impact="distributed" aria-pressed="false">Distributed</button>
        <button class="segment" type="button" data-impact="ready" aria-pressed="false">Ready</button>
      </div>
    </section>

    <section class="stat-card people-card" aria-labelledby="peopleTitle">
      <div class="card-head"><h2 class="card-name" id="peopleTitle">People</h2><span class="live"><span class="live-dot" aria-hidden="true"></span>Live</span></div>
      <div class="value" id="peopleValue" aria-live="polite">—</div>
      <p class="value-label" id="peopleLabel">Estimated total reach</p>
      <p class="value-note" id="peopleNote">Changes with the selected filter total.</p>
      <div class="segments impact-segments" aria-label="Choose estimated impact basis">
        <button class="segment" type="button" data-impact="inventory" aria-pressed="true">Total</button>
        <button class="segment" type="button" data-impact="distributed" aria-pressed="false">Distributed</button>
        <button class="segment" type="button" data-impact="ready" aria-pressed="false">Ready</button>
      </div>
    </section>

    <section class="stat-card countries-card" aria-labelledby="countriesTitle">
      <div class="card-head"><h2 class="card-name" id="countriesTitle">Countries</h2><span class="live"><span class="live-dot" aria-hidden="true"></span>Live</span></div>
      <div class="value" id="countryValue" aria-live="polite">—</div>
      <p class="value-label" id="countryLabel">Impact countries</p>
      <p class="value-note" id="countryNote">Countries with active, pilot, or completed impact.</p>
      <div class="segments" id="countrySegments" aria-label="Choose country stage">
        <button class="segment" type="button" data-country="impact" aria-pressed="true">Impact</button>
        <button class="segment" type="button" data-country="active" aria-pressed="false">Active</button>
        <button class="segment" type="button" data-country="pilot" aria-pressed="false">Pilots</button>
        <button class="segment" type="button" data-country="lead" aria-pressed="false">Leads</button>
      </div>
    </section>
  </div>
  <div class="bar-status" id="barStatus"><span class="live-dot" aria-hidden="true"></span><span id="updated">Connecting to live data…</span><button type="button" id="refresh">Refresh</button></div>
</main>

<script>
const DATA_URL='https://wata-map.cleanwataorg.workers.dev';
const IMPACT_STAGES=['Active','Pilot','Done'];
const IMPACT_COPY={
  inventory:{filterLabel:'Total filters',filterNote:'Distributed filters plus known in-country inventory.',peopleLabel:'Estimated total reach',peopleNote:'Five people per total filter.'},
  distributed:{filterLabel:'Filters distributed',filterNote:'Filters recorded as distributed through W.A.T.A. programs.',peopleLabel:'Estimated people reached',peopleNote:'Five people per distributed filter.'},
  ready:{filterLabel:'Ready to distribute',filterNote:'Known reported inventory awaiting distribution.',peopleLabel:'Estimated future reach',peopleNote:'Five people per known ready-to-distribute filter.'}
};
const COUNTRY_COPY={
  impact:['Impact countries','Active, pilot, or completed impact.'],active:['Active countries','Countries with an active W.A.T.A. program.'],pilot:['Pilot countries','Countries currently in the pilot stage.'],lead:['Country leads','Countries where a future program is being explored.']
};
let payload=null,impactMode='inventory',countryMode='impact';
const $=id=>document.getElementById(id),fmt=value=>value==null?'—':Math.round(value).toLocaleString('en-US');
function impactCountries(){return Object.values(payload?.countries||{}).filter(country=>IMPACT_STAGES.includes(country.status))}
function filterTotals(){
  const countries=impactCountries();
  const distributed=countries.reduce((sum,country)=>sum+(Number.isFinite(country.filters)?country.filters:0),0);
  const inventory=countries.reduce((sum,country)=>sum+(country.potentialFilters==null?(Number.isFinite(country.filters)?country.filters:0):Math.max(country.potentialFilters,country.filters||0)),0);
  const ready=countries.reduce((sum,country)=>sum+(country.potentialFilters==null?0:Math.max(country.potentialFilters-(country.filters||0),0)),0);
  const inventoryCoverage=countries.filter(country=>country.potentialFilters!=null).length;
  return{distributed,inventory,ready,inventoryCoverage,countryCount:countries.length};
}
function renderImpact(){
  if(!payload)return;
  const totals=filterTotals(),filters=totals[impactMode],copy=IMPACT_COPY[impactMode];
  $('filterValue').textContent=fmt(filters);$('filterLabel').textContent=copy.filterLabel;$('filterNote').textContent=impactMode==='ready'?`${copy.filterNote} ${totals.inventoryCoverage} of ${totals.countryCount} impact countries currently report inventory totals.`:copy.filterNote;
  $('peopleValue').textContent=fmt(filters*5);$('peopleLabel').textContent=copy.peopleLabel;$('peopleNote').textContent=copy.peopleNote;
  document.querySelectorAll('[data-impact]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.impact===impactMode)));
}
function renderCountries(){
  if(!payload)return;
  const countries=Object.values(payload.countries||{}),allowed=countryMode==='impact'?IMPACT_STAGES:[countryMode[0].toUpperCase()+countryMode.slice(1)];
  $('countryValue').textContent=fmt(countries.filter(country=>allowed.includes(country.status)).length);$('countryLabel').textContent=COUNTRY_COPY[countryMode][0];$('countryNote').textContent=COUNTRY_COPY[countryMode][1];
  document.querySelectorAll('[data-country]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.country===countryMode)));
}
document.querySelectorAll('.impact-segments').forEach(group=>group.addEventListener('click',event=>{const button=event.target.closest('[data-impact]');if(!button)return;impactMode=button.dataset.impact;renderImpact()}));
$('countrySegments').addEventListener('click',event=>{const button=event.target.closest('[data-country]');if(!button)return;countryMode=button.dataset.country;renderCountries()});
async function load(){
  $('refresh').disabled=true;$('barStatus').classList.remove('error');$('updated').textContent='Updating live data…';
  try{const response=await fetch(DATA_URL,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);payload=await response.json();renderImpact();renderCountries();$('updated').textContent=`Live data · updated ${payload.updated||'recently'}`}
  catch(error){$('filterNote').textContent='Current impact data is temporarily unavailable.';$('peopleNote').textContent='Current impact data is temporarily unavailable.';$('countryNote').textContent='Current impact data is temporarily unavailable.';$('updated').textContent='Live data unavailable';$('barStatus').classList.add('error')}
  finally{$('refresh').disabled=false}
}
$('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
