<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="application-version" content="1.3.1">
<meta name="theme-color" content="#000000">
<title>W.A.T.A. Live Impact Statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--ink:#0d2b38;--muted:#56717d;--line:rgba(13,43,56,.16);--cyan:#00bff3;--teal:#00a9a5;--indigo:#2757b6;--blue:#174aa0;--font:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;min-height:100%;background:transparent;color:var(--ink);font-family:var(--font)}
  button{font:inherit}
  .stats-shell{width:100%;max-width:1380px;margin:0 auto;padding:8px}
  .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
  .stat-card{--accent:var(--cyan);position:relative;display:flex;min-width:0;min-height:302px;overflow:hidden;flex-direction:column;padding:25px 24px 20px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(310px 190px at 96% -8%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 68%),#fff;box-shadow:0 15px 42px rgba(5,29,39,.13),inset 0 1px rgba(255,255,255,.9)}
  .stat-card::before{content:"";position:absolute;top:0;left:24px;right:24px;height:4px;border-radius:0 0 5px 5px;background:var(--accent)}
  .filters-card{--accent:var(--cyan)}.people-card{--accent:var(--indigo)}.countries-card{--accent:var(--teal)}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-name{margin:0;color:var(--blue);font-size:18px;font-weight:700;letter-spacing:-.01em}
  .live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--teal));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent,var(--teal)) 12%,transparent)}
  .stat-main{display:grid;grid-template-columns:minmax(0,1fr) 94px;align-items:center;gap:14px;margin:18px 0 0}
  .value{margin:0 0 5px;font-size:clamp(52px,6vw,82px);font-weight:700;line-height:.86;letter-spacing:-.065em;font-variant-numeric:tabular-nums}
  .value-label{min-height:24px;margin:0;color:var(--blue);font-size:17px;font-weight:700;line-height:1.25}
  .stat-icon{width:94px;height:94px;display:grid;place-items:center;filter:drop-shadow(0 10px 15px color-mix(in srgb,var(--accent) 22%,transparent))}
  .stat-icon svg{width:86px;height:86px;overflow:visible}
  .value-note{min-height:38px;margin:7px 0 17px;color:var(--muted);font-size:11px;line-height:1.45}
  .segments{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:auto}
  .countries-card .segments{grid-template-columns:repeat(4,minmax(0,1fr))}
  .segment{min-width:0;min-height:39px;padding:7px 8px;border:0;border-radius:999px;background:color-mix(in srgb,var(--accent) 13%,#fff);color:color-mix(in srgb,var(--accent) 72%,var(--ink));font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent);transition:background .16s ease,color .16s ease,transform .16s ease,box-shadow .16s ease}
  .segment:hover,.segment:focus-visible{background:color-mix(in srgb,var(--accent) 22%,#fff);color:var(--ink);outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
  .segment[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 7px 16px color-mix(in srgb,var(--accent) 26%,transparent),inset 0 1px rgba(255,255,255,.28)}
  .segment[aria-pressed="true"]:hover,.segment[aria-pressed="true"]:focus-visible{background:color-mix(in srgb,var(--accent) 88%,#073048);color:#fff}
  .bar-status{display:flex;align-items:center;justify-content:flex-end;gap:7px;width:max-content;min-height:28px;margin:8px 8px 0 auto;padding:6px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(6,21,30,.88);color:#dce8ec;font-size:10px}
  .bar-status .live-dot{width:6px;height:6px}.bar-status.error{color:#ffb9b6}.bar-status button{padding:0;border:0;background:transparent;color:#5dd7f5;font-size:10px;font-weight:700;cursor:pointer}
  .bar-status button:hover,.bar-status button:focus-visible{text-decoration:underline;outline:none}
  @media (max-width:1100px) and (min-width:901px){.stat-main{grid-template-columns:minmax(0,1fr) 72px}.stat-icon{width:72px;height:72px}.stat-icon svg{width:68px;height:68px}.card-name{font-size:16px}}
  @media (max-width:900px){.stats-grid{grid-template-columns:1fr}.stat-card{min-height:278px}.value{font-size:68px}}
  @media (max-width:430px){.stats-shell{padding:6px}.stats-grid{gap:12px}.stat-card{min-height:274px;padding:22px 17px 17px;border-radius:18px}.stat-card::before{left:18px;right:18px}.card-name{font-size:17px}.stat-main{grid-template-columns:minmax(0,1fr) 74px;gap:10px;margin-top:16px}.stat-icon{width:74px;height:74px}.stat-icon svg{width:70px;height:70px}.segment{font-size:9px;padding-inline:3px}.value{font-size:62px}.value-label{font-size:16px}.bar-status{justify-content:center;margin-right:auto;text-align:center}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="stats-shell" aria-label="Live W.A.T.A. impact statistics">
  <div class="stats-grid">
    <section class="stat-card filters-card" aria-labelledby="filtersTitle">
      <div class="card-head"><h2 class="card-name" id="filtersTitle">Filters</h2><span class="live"><span class="live-dot" aria-hidden="true"></span>Live</span></div>
      <div class="stat-main"><div><div class="value" id="filterValue" aria-live="polite">—</div><p class="value-label" id="filterLabel">Total Filters</p></div><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="dropBadge" x1="11" y1="8" x2="53" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#00c7f4"/><stop offset=".5" stop-color="#1478e8"/><stop offset="1" stop-color="#2439b8"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="url(#dropBadge)"/><circle cx="32" cy="32" r="26" fill="none" stroke="#7eeaff" stroke-opacity=".65" stroke-width="1.5"/><path d="M32 13c-4.6 8.1-13 18.4-13 28a13 13 0 0 0 26 0c0-9.6-8.4-19.9-13-28Z" fill="#fff"/><path d="M26 40c0 4 2.7 7 6.5 7" fill="none" stroke="#19bff1" stroke-width="3" stroke-linecap="round"/></svg></div></div>
      <p class="value-note" id="filterNote">Connecting to current impact data…</p>
      <div class="segments impact-segments" aria-label="Choose filter total">
        <button class="segment" type="button" data-impact="inventory" aria-pressed="true">Total</button>
        <button class="segment" type="button" data-impact="distributed" aria-pressed="false">Distributed</button>
        <button class="segment" type="button" data-impact="pending" aria-pressed="false">Pending</button>
      </div>
    </section>

    <section class="stat-card people-card" aria-labelledby="peopleTitle">
      <div class="card-head"><h2 class="card-name" id="peopleTitle">People</h2><span class="live"><span class="live-dot" aria-hidden="true"></span>Live</span></div>
      <div class="stat-main"><div><div class="value" id="peopleValue" aria-live="polite">—</div><p class="value-label" id="peopleLabel">Estimated Total Reach</p></div><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="peopleBadge" x1="10" y1="8" x2="55" y2="57" gradientUnits="userSpaceOnUse"><stop stop-color="#4b7de0"/><stop offset="1" stop-color="#173b96"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="url(#peopleBadge)"/><circle cx="32" cy="32" r="26" fill="none" stroke="#83dfff" stroke-opacity=".5" stroke-width="1.5"/><circle cx="32" cy="23" r="7" fill="#fff"/><circle cx="17.5" cy="28" r="5.2" fill="#5de2ef"/><circle cx="46.5" cy="28" r="5.2" fill="#5de2ef"/><path d="M20 49v-5.5C20 35.8 25.2 31 32 31s12 4.8 12 12.5V49H20Z" fill="#fff"/><path d="M9 49v-4.2c0-6.2 3.5-10.5 9-10.5 2.1 0 4 .7 5.4 1.9-2.7 2.9-4 6.1-4 10.1V49H9Zm46 0H44.6v-2.7c0-4-1.3-7.2-4-10.1a8.6 8.6 0 0 1 5.4-1.9c5.5 0 9 4.3 9 10.5V49Z" fill="#5de2ef"/></svg></div></div>
      <p class="value-note" id="peopleNote">Changes with the selected filter total.</p>
      <div class="segments impact-segments" aria-label="Choose estimated impact basis">
        <button class="segment" type="button" data-impact="inventory" aria-pressed="true">Total</button>
        <button class="segment" type="button" data-impact="distributed" aria-pressed="false">Distributed</button>
        <button class="segment" type="button" data-impact="pending" aria-pressed="false">Pending</button>
      </div>
    </section>

    <section class="stat-card countries-card" aria-labelledby="countriesTitle">
      <div class="card-head"><h2 class="card-name" id="countriesTitle">Countries</h2><span class="live"><span class="live-dot" aria-hidden="true"></span>Live</span></div>
      <div class="stat-main"><div><div class="value" id="countryValue" aria-live="polite">—</div><p class="value-label" id="countryLabel">Impact Countries</p></div><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><defs><linearGradient id="globeBadge" x1="9" y1="7" x2="55" y2="57" gradientUnits="userSpaceOnUse"><stop stop-color="#25d3d1"/><stop offset="1" stop-color="#008caa"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="url(#globeBadge)"/><circle cx="32" cy="32" r="26" fill="none" stroke="#9efff2" stroke-opacity=".65" stroke-width="1.5"/><path d="m12.5 25.5 5.2-7 8.5-4.1 6.8 2.2-1.8 4.5-5.8.8-2.1 5.2-5.1 2.3-5.7-3.9Zm14.2 6.2 7.5 1.2 3.8 5.4-4 5.1-1.2 8.4-4.4-3-1.8-8.2-4.5-5.3 4.6-3.6Zm11.8-13.9 8.5 2.6 5 5.7-4.2 3.8-5.7-1.5-2.3 4.7 4.6 3.3-2.1 7.1-4.5-2.4-1.4-7.4-4.8-4.4 3-4.2 3.9-1.5v-5.8Z" fill="#fff"/></svg></div></div>
      <p class="value-note" id="countryNote">Countries with active, pilot, or completed impact.</p>
      <div class="segments" id="countrySegments" aria-label="Choose country stage">
        <button class="segment" type="button" data-country="impact" aria-pressed="true">Impact</button>
        <button class="segment" type="button" data-country="active" aria-pressed="false">Active</button>
        <button class="segment" type="button" data-country="pilot" aria-pressed="false">Pilots</button>
        <button class="segment" type="button" data-country="lead" aria-pressed="false">Leads</button>
      </div>
    </section>
  </div>
  <div class="bar-status" id="barStatus"><span class="live-dot" aria-hidden="true"></span><span id="updated">Connecting to live data…</span><button type="button" id="refresh">Refresh</button></div>
</main>

<script>
const DATA_URL='https://wata-map.cleanwataorg.workers.dev';
const IMPACT_STAGES=['Active','Pilot','Done'];
const IMPACT_COPY={
  inventory:{filterLabel:'Total Filters',filterNote:'Distributed plus reported pending filters.',peopleLabel:'Estimated Total Reach',peopleNote:'Five people per total filter.'},
  distributed:{filterLabel:'Filters Distributed',filterNote:'Filters recorded as distributed through W.A.T.A. programs.',peopleLabel:'Estimated People Reached',peopleNote:'Five people per distributed filter.'},
  pending:{filterLabel:'Filters Pending',filterNote:'Reported filters in country that have not yet been distributed.',peopleLabel:'Estimated Pending Reach',peopleNote:'Five people per reported pending filter.'}
};
const COUNTRY_COPY={
  impact:['Impact Countries','Active, pilot, or completed impact.'],active:['Active Countries','Countries with an active W.A.T.A. program.'],pilot:['Pilot Countries','Countries currently in the pilot stage.'],lead:['Country Leads','Countries where a future program is being explored.']
};
let payload=null,impactMode='inventory',countryMode='impact';
const $=id=>document.getElementById(id),fmt=value=>value==null?'—':Math.round(value).toLocaleString('en-US');
function impactCountries(){return Object.values(payload?.countries||{}).filter(country=>IMPACT_STAGES.includes(country.status))}
function filterTotals(){
  const countries=impactCountries();
  const distributed=countries.reduce((sum,country)=>sum+(Number.isFinite(country.filters)?country.filters:0),0);
  const inventory=countries.reduce((sum,country)=>sum+(country.potentialFilters==null?(Number.isFinite(country.filters)?country.filters:0):Math.max(country.potentialFilters,country.filters||0)),0);
  const pending=countries.reduce((sum,country)=>sum+(country.potentialFilters==null?0:Math.max(country.potentialFilters-(country.filters||0),0)),0);
  const inventoryCoverage=countries.filter(country=>country.potentialFilters!=null).length;
  return{distributed,inventory,pending,inventoryCoverage,countryCount:countries.length};
}
function renderImpact(){
  if(!payload)return;
  const totals=filterTotals(),filters=totals[impactMode],copy=IMPACT_COPY[impactMode];
  $('filterValue').textContent=fmt(filters);$('filterLabel').textContent=copy.filterLabel;$('filterNote').textContent=impactMode==='pending'?`${copy.filterNote} ${totals.inventoryCoverage} of ${totals.countryCount} impact countries currently report inventory totals.`:copy.filterNote;
  $('peopleValue').textContent=`${fmt(filters*5)}+`;$('peopleLabel').textContent=copy.peopleLabel;$('peopleNote').textContent=copy.peopleNote;
  document.querySelectorAll('[data-impact]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.impact===impactMode)));
}
function renderCountries(){
  if(!payload)return;
  const countries=Object.values(payload.countries||{}),allowed=countryMode==='impact'?IMPACT_STAGES:[countryMode[0].toUpperCase()+countryMode.slice(1)];
  $('countryValue').textContent=fmt(countries.filter(country=>allowed.includes(country.status)).length);$('countryLabel').textContent=COUNTRY_COPY[countryMode][0];$('countryNote').textContent=COUNTRY_COPY[countryMode][1];
  document.querySelectorAll('[data-country]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.country===countryMode)));
}
document.querySelectorAll('.impact-segments').forEach(group=>group.addEventListener('click',event=>{const button=event.target.closest('[data-impact]');if(!button)return;impactMode=button.dataset.impact;renderImpact()}));
$('countrySegments').addEventListener('click',event=>{const button=event.target.closest('[data-country]');if(!button)return;countryMode=button.dataset.country;renderCountries()});
async function load(){
  $('refresh').disabled=true;$('barStatus').classList.remove('error');$('updated').textContent='Updating live data…';
  try{const response=await fetch(DATA_URL,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);payload=await response.json();renderImpact();renderCountries();$('updated').textContent=`Live data · updated ${payload.updated||'recently'}`}
  catch(error){$('filterNote').textContent='Current impact data is temporarily unavailable.';$('peopleNote').textContent='Current impact data is temporarily unavailable.';$('countryNote').textContent='Current impact data is temporarily unavailable.';$('updated').textContent='Live data unavailable';$('barStatus').classList.add('error')}
  finally{$('refresh').disabled=false}
}
$('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
